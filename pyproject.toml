[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0,<3.0.0"]

[tool.poetry]
name = "poetry-plugin-dotenv"
version = "3.3.4"
description = "poetry-plugin-dotenv - is the plugin that automatically loads environment variables from a dotenv file into the environment before poetry commands are run."
license = "MIT"
authors = ["Volodymyr Pivoshenko <contact@pivoshenko.dev>"]
maintainers = ["Volodymyr Pivoshenko <contact@pivoshenko.dev>"]
readme = "README.md"
homepage = "https://github.com/pivoshenko/poetry-plugin-dotenv"
repository = "https://github.com/pivoshenko/poetry-plugin-dotenv"
documentation = "https://github.com/pivoshenko/poetry-plugin-dotenv"
keywords = [
  "config",
  "configuration",
  "configuration-management",
  "cross-platform",
  "dotenv",
  "env",
  "hacktoberfest",
  "plugin",
  "plugins",
  "poetry",
  "poetry-plugin",
  "poetry-plugins",
  "pypi",
  "python"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Other Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
packages = [{ include = "poetry_plugin_dotenv", from = "src" }]
dependencies.python = ">=3.9,<4.0"
dependencies.poetry = ">=1.5.0,<3.0.0"
group.dev.dependencies.ipdb = "~=0.13.13"
group.dev.dependencies.ipython = { version = "~=9.18.1", python = ">=3.11" }
group.formatters.dependencies.ruff = "~=0.17.4"
group.linters.dependencies.ruff = "~=0.17.4"
group.linters.dependencies.ty = "~=0.0.99"
group.tests.dependencies.coverage = { version = "~=7.10.7", extras = ["toml"] }
group.tests.dependencies.pytest = "~=8.4.2"
group.tests.dependencies.pytest-cov = "~=7.1.0"
group.tests.dependencies.pytest-mock = "~=3.15.1"
group.tests.dependencies.pytest-sugar = "~=1.1.1"
plugins."poetry.application.plugin".poetry-plugin-dotenv = "poetry_plugin_dotenv.plugin:DotenvPlugin"
urls.Issues = "https://github.com/pivoshenko/poetry-plugin-dotenv/issues"
urls.Releases = "https://github.com/pivoshenko/poetry-plugin-dotenv/releases"

[tool.ruff]
target-version = "py39"
line-length = 100
fix = true
unsafe-fixes = true
format.quote-style = "double"
format.docstring-code-format = true
lint.select = ["ALL"]
lint.ignore = ["COM812", "CPY001", "D101", "D102", "D103", "D107", "D203", "D213"]
lint.per-file-ignores."docs/examples/main.py" = ["INP001", "T201"]
lint.per-file-ignores."src/poetry_plugin_dotenv/__init__.py" = ["E501"]
lint.per-file-ignores."src/poetry_plugin_dotenv/dotenv/variables.py" = [
  "ANN002",
  "ANN003",
  "ARG002"
]
lint.per-file-ignores."src/poetry_plugin_dotenv/plugin.py" = ["ANN002", "ANN003", "ARG002"]
lint.per-file-ignores."tests/**" = ["INP001", "PLR2004", "S101", "SLF001"]
lint.isort.force-single-line = true
lint.isort.from-first = false
lint.isort.length-sort-straight = true
lint.isort.lines-after-imports = 2
lint.isort.lines-between-types = 1
lint.isort.required-imports = ["from __future__ import annotations"]

[tool.ty]
environment.python-version = "3.9"
rules.invalid-argument-type = "ignore"
rules.unresolved-attribute = "ignore"

[tool.pytest]
ini_options.testpaths = ["tests"]
ini_options.addopts = [
  "--basetemp=tests/fixtures",
  "--color=yes",
  "--cov=src",
  "--cov-report=term-missing"
]

[tool.coverage]
run.omit = ["*/__init__.py"]
